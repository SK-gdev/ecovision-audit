# Netlify configuration for EcoVision Audit

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA Fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional API proxy: If you set BACKEND_API_URL in Netlify environment variables,
# uncomment or use the rewrite rule below:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend.onrender.com/api/:splat"
#   status = 200
#   force = true

# Security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
